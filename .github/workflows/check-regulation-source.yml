name: Verify remaining official regulation PDF
on:
  push:
    branches: [maintenance/regulation-source-check]
permissions:
  contents: read
jobs:
  source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect original government PDF
        shell: bash
        run: |
          pip install --quiet pypdf
          python3 - <<'PY'
          import urllib.request,hashlib,io
          from pypdf import PdfReader
          url='https://lss.lubuklinggaukota.go.id/uploads/produk_hukum/bb85d5fb1e0928f85a34b35d471d8102.pdf'
          b=urllib.request.urlopen(url,timeout=40).read()
          assert b.startswith(b'%PDF-')
          r=PdfReader(io.BytesIO(b))
          print('PDF_IDENTITY',len(b),hashlib.sha256(b).hexdigest(),'PAGES',len(r.pages),flush=True)
          print('FIRST_PAGE',r.pages[0].extract_text(),flush=True)
          print('LAST_PAGE',r.pages[-1].extract_text(),flush=True)
          PY
