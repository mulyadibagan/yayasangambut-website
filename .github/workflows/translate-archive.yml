name: Prepare English archive translations
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/translate-archive.mjs', '.github/workflows/translate-archive.yml']
permissions:
  contents: read
concurrency:
  group: english-archive-translations
  cancel-in-progress: false
jobs:
  translate:
    runs-on: ubuntu-latest
    environment: staff-production
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts
        working-directory: staff
      - name: Translate published Indonesian archive for review
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/translate-archive.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: english-archive-review
          path: archive-translations/
          retention-days: 7
