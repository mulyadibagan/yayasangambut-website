name: Publish website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build and validate website
        env:
          SITE_ORIGIN: https://yayasangambut.org
          GH_TOKEN: ${{ github.token }}
        run: |
          npm run build:production
          gh release download media-archive-2026-10-04 --pattern wordpress-media.tar.gz --dir /tmp/yg-media
          echo 'baf90fa597e4bae878803cf473a0780f69e8bf85a69e756408e51f3c66cf3bcb  /tmp/yg-media/wordpress-media.tar.gz' | sha256sum --check
          tar -xzf /tmp/yg-media/wordpress-media.tar.gz -C dist
          node scripts/prepare-production-pages.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
