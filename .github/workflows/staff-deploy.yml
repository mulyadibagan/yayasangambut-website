name: Deploy staff dashboard
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: staff-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staff-production
    timeout-minutes: 15
    defaults:
      run:
        working-directory: staff
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: staff/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Build public article preview templates
        working-directory: .
        run: |
          npm ci --ignore-scripts
          npm run build
          node staff/scripts/build-preview.mjs
      - run: npm test
      - run: npm run check
        env:
          WRANGLER_SEND_METRICS: 'false'
      - name: Validate configuration and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAFF_D1_DATABASE_ID: ${{ vars.STAFF_D1_DATABASE_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GITHUB_APP_ID: ${{ secrets.STAFF_GITHUB_APP_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.STAFF_GITHUB_APP_PRIVATE_KEY }}
          GITHUB_INSTALLATION_ID: ${{ secrets.STAFF_GITHUB_INSTALLATION_ID }}
          GA_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GA_SERVICE_ACCOUNT_EMAIL }}
          GA_SERVICE_ACCOUNT_KEY: ${{ secrets.GA_SERVICE_ACCOUNT_KEY }}
          WRANGLER_SEND_METRICS: 'false'
        run: node scripts/deploy.mjs
