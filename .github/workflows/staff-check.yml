name: Validate staff dashboard
on:
  pull_request:
    paths: ['staff/**', '.github/workflows/staff-check.yml']
  push:
    paths: ['staff/**', '.github/workflows/staff-check.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: staff
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: staff/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check
        env:
          WRANGLER_SEND_METRICS: 'false'
